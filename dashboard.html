<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — AI Made Simple</title>
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="apple-touch-icon" href="logo.svg">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#C9A84C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,400&family=DM+Sans:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--gold:#C9A84C;--gold-dim:rgba(201,168,76,0.15);--transition:0.3s ease;}
[data-theme="dark"]{--bg:#0E0E10;--bg2:#141416;--bg3:#1C1C20;--border:rgba(255,255,255,0.07);--text:#F0EDE6;--text-muted:#7A7870;--text-secondary:#B8B5AE;--card-bg:#16161A;--card-border:rgba(201,168,76,0.12);--nav-bg:rgba(14,14,16,0.95);--input-bg:#1C1C20;--shadow:0 8px 48px rgba(0,0,0,0.5);--sidebar-bg:#121214;}
[data-theme="light"]{--bg:#F8F6F1;--bg2:#EEEBE4;--bg3:#E4E1DA;--border:rgba(0,0,0,0.08);--text:#1A1914;--text-muted:#8A877E;--text-secondary:#4A4740;--card-bg:#FAFAF7;--card-border:rgba(201,168,76,0.25);--nav-bg:rgba(248,246,241,0.95);--input-bg:#EEEBE4;--shadow:0 8px 48px rgba(0,0,0,0.1);--sidebar-bg:#EEEBE4;}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;transition:background var(--transition),color var(--transition);}
nav{position:sticky;top:0;z-index:200;background:var(--nav-bg);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:0 1.25rem;height:60px;display:flex;align-items:center;gap:0.75rem;}
.nav-brand{display:flex;align-items:center;gap:8px;text-decoration:none;flex-shrink:0;}
.nav-logo-svg{border-radius:6px;}
.nav-name{font-family:'Cormorant Garamond',serif;font-size:1.1rem;font-weight:600;color:var(--text);}
.nav-prog-tabs{display:flex;gap:4px;flex:1;overflow-x:auto;scrollbar-width:none;}
.nav-prog-tabs::-webkit-scrollbar{display:none;}
.prog-tab{padding:5px 12px;border-radius:20px;border:1px solid var(--border);background:transparent;font-size:0.7rem;font-weight:600;color:var(--text-muted);cursor:pointer;white-space:nowrap;transition:all 0.2s;font-family:inherit;}
.prog-tab.active{background:var(--gold-dim);border-color:var(--gold);color:var(--gold);}
.nav-right{display:flex;align-items:center;gap:0.6rem;flex-shrink:0;}
.progress-bar-nav{width:110px;height:4px;background:var(--bg3);border-radius:4px;overflow:hidden;}
.progress-bar-fill{height:100%;background:var(--gold);border-radius:4px;transition:width 0.5s ease;}
.progress-pct{font-family:'Space Mono',monospace;font-size:0.66rem;color:var(--gold);font-weight:700;white-space:nowrap;}
.nav-user{font-size:0.78rem;color:var(--text-secondary);}
.nav-user strong{color:var(--text);}
.theme-toggle{display:flex;align-items:center;gap:2px;background:var(--bg3);border-radius:20px;padding:3px;border:1px solid var(--border);}
.theme-btn{width:26px;height:22px;border:none;border-radius:16px;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;transition:background var(--transition);color:var(--text-muted);}
.theme-btn.active{background:var(--gold);color:#0E0E10;}
.btn-logout{background:transparent;border:1px solid var(--border);color:var(--text-muted);padding:5px 10px;border-radius:4px;font-family:'DM Sans',sans-serif;font-size:0.7rem;cursor:pointer;transition:all var(--transition);}
.btn-logout:hover{border-color:var(--gold);color:var(--gold);}
/* ── SIDEBAR TOGGLE (hamburger) ── */
.sidebar-toggle{display:none;align-items:center;justify-content:center;background:var(--bg3);border:1px solid var(--border);color:var(--text-muted);width:34px;height:34px;border-radius:6px;cursor:pointer;font-size:18px;flex-shrink:0;transition:all 0.2s;line-height:1;}
.sidebar-toggle:hover{border-color:var(--gold);color:var(--gold);background:var(--gold-dim);}

/* ── SIDEBAR OVERLAY backdrop ── */
.sidebar-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);backdrop-filter:blur(3px);z-index:150;opacity:0;pointer-events:none;transition:opacity 0.3s;}

/* ── NOTIFICATION BAR ── */
.notif-bar{background:var(--gold-dim);border-bottom:1px solid var(--gold-border);padding:10px clamp(1.25rem,3vw,2.5rem);display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:relative;z-index:80;}
.notif-icon{font-size:15px;flex-shrink:0;}
.notif-text{font-size:0.78rem;color:var(--text-secondary);flex:1;line-height:1.4;}
.btn-enable-notifs{background:var(--gold);color:#0E0E10;border:none;padding:6px 16px;border-radius:4px;font-family:'DM Sans',sans-serif;font-size:0.72rem;font-weight:700;cursor:pointer;text-transform:uppercase;letter-spacing:0.06em;transition:all 0.2s;flex-shrink:0;white-space:nowrap;}
.btn-enable-notifs:hover{opacity:0.85;}
.notif-close{background:transparent;border:none;color:var(--text-muted);cursor:pointer;font-size:16px;padding:2px 6px;flex-shrink:0;line-height:1;}
.notif-close:hover{color:var(--text);}

/* ── CLASS SCHEDULE / CALENDAR WIDGET ── */
.schedule-card{background:var(--card-bg);border:1px solid var(--card-border);border-radius:10px;padding:1rem 1.25rem;margin-bottom:1.25rem;display:flex;align-items:center;gap:1.25rem;flex-wrap:wrap;position:relative;overflow:hidden;}
.schedule-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--gold);}
.schedule-date-block{text-align:center;flex-shrink:0;min-width:52px;}
.schedule-day-num{font-family:'Cormorant Garamond',serif;font-size:2rem;font-weight:700;color:var(--gold);line-height:1;}
.schedule-day-name{font-size:0.58rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--text-muted);}
.schedule-divider{width:1px;height:44px;background:var(--border);flex-shrink:0;}
.schedule-info{flex:1;min-width:140px;}
.schedule-label{font-size:0.62rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--gold);margin-bottom:3px;}
.schedule-title{font-size:0.88rem;font-weight:600;color:var(--text);line-height:1.3;}
.schedule-time{font-size:0.75rem;color:var(--text-muted);margin-top:3px;display:flex;align-items:center;gap:4px;}
.schedule-countdown{text-align:right;flex-shrink:0;}
.countdown-val{font-family:'Space Mono',monospace;font-size:1rem;font-weight:700;color:var(--text);line-height:1;}
.countdown-lbl{font-size:0.58rem;color:var(--text-muted);letter-spacing:0.06em;text-transform:uppercase;}
.app-layout{flex:1;display:flex;min-height:calc(100vh - 60px);}
.sidebar{width:256px;flex-shrink:0;background:var(--sidebar-bg);border-right:1px solid var(--border);overflow-y:auto;position:sticky;top:60px;height:calc(100vh - 60px);padding:1rem 0;transition:transform 0.3s ease,background var(--transition);}
.sidebar-section{margin-bottom:0.25rem;}
.sidebar-section-hdr{display:flex;align-items:center;justify-content:space-between;padding:7px 1rem;cursor:pointer;user-select:none;}
.sidebar-section-title{font-size:0.66rem;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--text-muted);}
.sidebar-arrow{font-size:8px;color:var(--text-muted);transition:transform 0.3s;}
.sidebar-section.open .sidebar-arrow{transform:rotate(180deg);}
.sidebar-lessons{max-height:0;overflow:hidden;transition:max-height 0.35s ease;}
.sidebar-section.open .sidebar-lessons{max-height:2400px;}
.s-lesson{display:flex;align-items:center;gap:7px;padding:7px 1rem 7px 1.75rem;cursor:pointer;transition:background 0.15s;border-left:2px solid transparent;margin-left:-2px;}
.s-lesson:hover{background:var(--gold-dim);}
.s-lesson.active{border-left-color:var(--gold);background:var(--gold-dim);}
.s-lesson.locked{opacity:0.38;cursor:not-allowed;}
.s-dot{width:6px;height:6px;border:1.5px solid var(--text-muted);border-radius:50%;flex-shrink:0;transition:all 0.2s;}
.s-dot.done{background:var(--gold);border-color:var(--gold);}
.s-dot.cur{border-color:var(--gold);box-shadow:0 0 5px rgba(201,168,76,0.5);}
.s-title{font-size:0.73rem;color:var(--text-secondary);line-height:1.3;flex:1;}
.s-lesson.active .s-title{color:var(--text);font-weight:500;}
.s-lock{font-size:9px;color:var(--text-muted);}
.s-check{font-size:10px;color:var(--gold);}
.main-content{flex:1;padding:clamp(1.25rem,3vw,2.5rem);min-width:0;}
.payment-gate{background:var(--card-bg);border:1px solid rgba(201,168,76,0.3);border-radius:12px;padding:2.5rem;text-align:center;max-width:540px;margin:2rem auto;}
.gate-icon{font-size:2.75rem;margin-bottom:1rem;}
.gate-title{font-family:'Cormorant Garamond',serif;font-size:1.75rem;font-weight:700;color:var(--text);margin-bottom:0.75rem;}
.gate-desc{font-size:0.88rem;color:var(--text-secondary);line-height:1.7;margin-bottom:1.75rem;}
.gate-actions{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;}
.btn-pay{background:var(--gold);color:#0E0E10;border:none;padding:11px 26px;border-radius:5px;font-family:'DM Sans',sans-serif;font-size:0.83rem;font-weight:700;cursor:pointer;letter-spacing:0.05em;text-transform:uppercase;text-decoration:none;transition:all 0.2s;display:inline-flex;align-items:center;gap:6px;}
.btn-pay:hover{opacity:0.88;transform:translateY(-1px);}
.btn-outline{background:transparent;color:var(--text);border:1px solid var(--border);padding:11px 20px;border-radius:5px;font-family:'DM Sans',sans-serif;font-size:0.82rem;cursor:pointer;transition:all 0.2s;}
.btn-outline:hover{border-color:var(--gold);color:var(--gold);}
.dash-header{margin-bottom:1.5rem;}
.welcome-tag{font-size:0.66rem;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--gold);margin-bottom:0.35rem;}
.welcome-title{font-family:'Cormorant Garamond',serif;font-size:clamp(1.5rem,3vw,2rem);font-weight:700;color:var(--text);line-height:1.2;}
.welcome-sub{font-size:0.8rem;color:var(--text-secondary);margin-top:0.35rem;}
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:0.75rem;margin-bottom:1.25rem;}
.stat-card{background:var(--card-bg);border:1px solid var(--border);border-radius:8px;padding:0.875rem;}
.stat-card-label{font-size:0.62rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--text-muted);margin-bottom:0.2rem;}
.stat-card-value{font-family:'Cormorant Garamond',serif;font-size:1.75rem;font-weight:700;color:var(--gold);line-height:1;}
.stat-card-sub{font-size:0.66rem;color:var(--text-muted);margin-top:2px;}
.week-tracker{background:var(--card-bg);border:1px solid var(--border);border-radius:10px;padding:1.125rem;margin-bottom:1.25rem;}
.tracker-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:0.875rem;}
.tracker-title{font-size:0.65rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--text-muted);}
.streak-badge{font-family:'Space Mono',monospace;font-size:0.7rem;color:var(--gold);background:var(--gold-dim);padding:3px 10px;border-radius:100px;}
.week-days{display:flex;gap:0.4rem;}
.day-circle{flex:1;aspect-ratio:1;max-width:40px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;flex-direction:column;background:transparent;transition:all 0.2s;}
.day-circle.done{background:var(--gold);border-color:var(--gold);}
.day-circle.today{border-color:var(--gold);box-shadow:0 0 8px rgba(201,168,76,0.3);}
.day-name{font-size:0.52rem;font-weight:700;letter-spacing:0.04em;color:var(--text-muted);}
.day-circle.done .day-name{color:#0E0E10;}
.phase-progress{display:grid;grid-template-columns:repeat(3,1fr);gap:0.75rem;margin-bottom:1.25rem;}
.phase-card{background:var(--card-bg);border:1px solid var(--border);border-radius:8px;padding:0.875rem;text-align:center;}
.ring-container{position:relative;width:60px;height:60px;margin:0 auto 0.5rem;}
.ring-svg{transform:rotate(-90deg);}
.ring-bg{fill:none;stroke:var(--bg3);stroke-width:5;}
.ring-fill{fill:none;stroke:var(--gold);stroke-width:5;stroke-linecap:round;transition:stroke-dashoffset 0.8s ease;}
.ring-text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Space Mono',monospace;font-size:0.68rem;font-weight:700;color:var(--gold);}
.phase-label{font-size:0.62rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--text-muted);margin-bottom:2px;}
.phase-name{font-size:0.72rem;color:var(--text-secondary);}
.today-card{background:var(--card-bg);border:1px solid var(--card-border);border-radius:12px;overflow:hidden;margin-bottom:1.25rem;}
.today-hdr{background:var(--gold-dim);border-bottom:1px solid rgba(201,168,76,0.15);padding:0.8rem 1.25rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:0.5rem;}
.today-label{font-size:0.66rem;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--gold);}
.timer-wrap{display:flex;align-items:center;gap:5px;font-size:0.72rem;color:var(--text-secondary);}
.timer-display{background:var(--bg3);border-radius:4px;padding:3px 8px;color:var(--gold);font-family:'Space Mono',monospace;font-weight:700;font-size:0.8rem;min-width:54px;text-align:center;}
.timer-btn{background:var(--bg3);border:1px solid var(--border);color:var(--text-secondary);padding:3px 8px;border-radius:4px;font-size:0.68rem;cursor:pointer;font-family:inherit;}
.today-body{padding:1.125rem 1.25rem;}
.today-day{font-family:'Space Mono',monospace;font-size:0.63rem;color:var(--gold);font-weight:700;letter-spacing:0.1em;margin-bottom:0.2rem;}
.today-title{font-family:'Cormorant Garamond',serif;font-size:1.35rem;font-weight:700;color:var(--text);margin-bottom:0.4rem;}
.tool-badge{display:inline-flex;align-items:center;gap:5px;background:var(--bg3);border:1px solid var(--border);border-radius:100px;padding:3px 11px;font-size:0.66rem;font-weight:600;color:var(--text-secondary);margin-bottom:0.75rem;}
.today-desc{font-size:0.82rem;color:var(--text-secondary);line-height:1.7;margin-bottom:0.875rem;}
.task-box{background:var(--bg3);border-left:3px solid var(--gold);padding:0.75rem 1rem;border-radius:0 6px 6px 0;margin-bottom:0.875rem;}
.task-label{font-size:0.62rem;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--gold);margin-bottom:0.25rem;}
.task-text{font-size:0.8rem;color:var(--text);line-height:1.6;}
.notes-section{margin-top:0.875rem;}
.notes-toggle{display:flex;align-items:center;justify-content:space-between;background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:8px 13px;cursor:pointer;font-size:0.72rem;font-weight:600;letter-spacing:0.05em;text-transform:uppercase;color:var(--text-secondary);width:100%;transition:all 0.2s;}
.notes-toggle:hover{border-color:var(--gold);color:var(--gold);}
.notes-toggle.open{border-radius:6px 6px 0 0;border-color:var(--gold);color:var(--gold);}
.notes-toggle .narrow{transition:transform 0.3s;font-size:8px;}
.notes-toggle.open .narrow{transform:rotate(180deg);}
.notes-content{max-height:0;overflow:hidden;transition:max-height 0.45s ease;}
.notes-content.open{max-height:3000px;}
.notes-inner{border:1px solid var(--gold);border-top:none;border-radius:0 0 6px 6px;padding:1.125rem;background:var(--card-bg);}
.notes-step{display:flex;gap:8px;margin-bottom:0.75rem;font-size:0.8rem;line-height:1.65;}
.notes-step:last-child{margin-bottom:0;}
.step-arrow{color:var(--gold);font-weight:700;flex-shrink:0;margin-top:1px;font-size:0.9rem;}
.step-body{color:var(--text-secondary);flex:1;}
.step-body strong{color:var(--text);}
.notes-highlight{background:var(--gold-dim);border-left:3px solid var(--gold);padding:8px 12px;border-radius:0 5px 5px 0;font-size:0.78rem;color:var(--text);margin:0.5rem 0;line-height:1.6;}
.notes-warn{background:rgba(224,90,90,0.08);border-left:3px solid #e05a5a;padding:8px 12px;border-radius:0 5px 5px 0;font-size:0.76rem;color:#e05a5a;margin:0.5rem 0;}
.notes-tip{background:rgba(76,201,112,0.07);border-left:3px solid #4cc974;padding:8px 12px;border-radius:0 5px 5px 0;font-size:0.76rem;color:#5fd48a;margin:0.5rem 0;}
.notes-section-hd{font-size:0.68rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--gold);margin:0.875rem 0 0.4rem;}
.notes-checklist{list-style:none;display:flex;flex-direction:column;gap:4px;}
.notes-checklist li{display:flex;align-items:flex-start;gap:7px;font-size:0.78rem;color:var(--text-secondary);}
.notes-checklist li::before{content:"☐";color:var(--gold);flex-shrink:0;}
/* ── PAGE FOOTER ── */
footer{background:var(--bg2);border-top:1px solid var(--border);padding:1.125rem clamp(1.25rem,3vw,2.5rem);position:relative;z-index:10;flex-shrink:0;}
.footer-inner{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;}
.footer-copy{font-size:0.74rem;color:var(--text-muted);}
.footer-links{display:flex;gap:1.5rem;align-items:center;}
.footer-links a{font-size:0.74rem;color:var(--text-muted);text-decoration:none;transition:color var(--transition);}
.footer-links a:hover{color:var(--gold);}
.today-footer{padding:0.875rem 1.25rem;border-top:1px solid var(--border);display:flex;align-items:center;gap:0.6rem;flex-wrap:wrap;}
.btn-complete{background:var(--gold);color:#0E0E10;border:none;padding:8px 20px;border-radius:5px;font-family:'DM Sans',sans-serif;font-size:0.76rem;font-weight:700;cursor:pointer;letter-spacing:0.05em;text-transform:uppercase;transition:all 0.2s;display:flex;align-items:center;gap:5px;}
.btn-complete:hover{opacity:0.85;transform:translateY(-1px);}
.btn-complete:disabled{opacity:0.5;cursor:not-allowed;transform:none;}
.btn-complete.done{background:#4a7c59;}
.btn-next{background:transparent;color:var(--text-secondary);border:1px solid var(--border);padding:8px 14px;border-radius:5px;font-family:'DM Sans',sans-serif;font-size:0.76rem;cursor:pointer;transition:all 0.2s;}
.btn-next:hover{border-color:var(--gold);color:var(--gold);}
.modules-list{margin-bottom:1.25rem;}
.modules-label{font-size:0.66rem;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--text-muted);margin-bottom:0.75rem;}
.module-card{background:var(--card-bg);border:1px solid var(--border);border-radius:8px;padding:0.875rem;margin-bottom:0.5rem;transition:border-color 0.2s;cursor:pointer;}
.module-card:hover{border-color:rgba(201,168,76,0.2);}
.module-card.locked{cursor:not-allowed;}
.module-card-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:0.25rem;}
.module-phase-tag{font-family:'Space Mono',monospace;font-size:0.6rem;color:var(--gold);font-weight:700;letter-spacing:0.1em;}
.module-status{font-size:0.62rem;padding:2px 7px;border-radius:100px;font-weight:600;}
.status-locked{background:rgba(120,120,120,0.1);color:var(--text-muted);}
.status-active{background:rgba(201,168,76,0.1);color:var(--gold);}
.status-done{background:rgba(74,124,89,0.1);color:#5fd48a;}
.module-title{font-size:0.87rem;font-weight:600;color:var(--text);margin-bottom:0.2rem;}
.module-sub{font-size:0.73rem;color:var(--text-muted);}
.module-bar{height:3px;background:var(--bg3);border-radius:3px;margin-top:0.65rem;overflow:hidden;}
.module-bar-fill{height:100%;background:var(--gold);border-radius:3px;transition:width 0.6s ease;}
.mc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:1rem;margin-bottom:1.5rem;}
.mc-card{background:var(--card-bg);border:1px solid var(--border);border-radius:10px;padding:1.125rem;position:relative;overflow:hidden;transition:all 0.2s;}
.mc-card:hover:not(.locked){border-color:rgba(201,168,76,0.3);transform:translateY(-2px);}
.mc-card.locked{opacity:1;}
.mc-card.locked .mc-name,.mc-card.locked .mc-desc{opacity:0.75;}
.mc-syllabus-toggle{display:flex;align-items:center;justify-content:space-between;background:var(--bg3);border:1px solid var(--border);border-radius:5px;padding:7px 12px;cursor:pointer;font-size:0.68rem;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--text-secondary);width:100%;transition:all 0.2s;margin-bottom:0.5rem;}
.mc-syllabus-toggle:hover{border-color:var(--gold);color:var(--gold);}
.mc-syllabus-toggle.open{border-radius:5px 5px 0 0;border-color:var(--gold);color:var(--gold);}

function applyTheme(m){const d=window.matchMedia('(prefers-color-scheme: dark)').matches;document.documentElement.setAttribute('data-theme',m==='system'?(d?'dark':'light'):m);}
(function(){const s=localStorage.getItem('ams-theme')||'dark';applyTheme(s);const map={light:'themeLight',dark:'themeDark',system:'themeSystem'};document.addEventListener('DOMContentLoaded',()=>{document.querySelectorAll('.theme-btn').forEach(b=>b.classList.remove('active'));document.getElementById(map[s])?.classList.add('active');});})();

{id:1,cat:'AI Models',date:'May 2026',rt:'5 min read',featured:true,
 title:`Claude 4 Redefines What AI Can Do for Your Business`,
 excerpt:`Anthropic's Claude 4 family brings autonomous reasoning, real-time browsing, and multi-step task execution. Here's your practical guide to what's changed and how to leverage it.`,
 body:`<p>When Anthropic released Claude 4, the shift was immediately clear. This wasn't a marginal improvement — it was a rethinking of what AI can do for you.</p>
<h3>What's Actually New</h3><p>Claude 4 introduced two major capabilities: <strong>extended thinking</strong> (the model reasons through complex problems step by step) and <strong>agentic task execution</strong> (it can plan, use tools, and complete multi-step tasks autonomously).</p>
<p>For entrepreneurs and knowledge workers, this means delegating genuine cognitive work — not just writing or summarising, but thinking through business problems and producing structured output.</p>
<h3>What This Means in Practice</h3><ul><li><strong>Business proposals:</strong> Claude 4 can research, draft, and refine a complete proposal in one session</li><li><strong>Data analysis:</strong> Feed it a spreadsheet and ask for strategic insights — not just summaries</li><li><strong>Automation planning:</strong> Describe your workflow and it designs the automation architecture</li></ul>
<h3>The Takeaway</h3><p>Claude 4 rewards people who know how to direct AI effectively. The gap between AI-literate and AI-naive professionals has never been wider.</p>`},

{id:2,cat:'Tools & Apps',date:'May 2026',rt:'4 min read',featured:false,
 title:`The 7 AI Tools Every Nigerian Entrepreneur Needs in 2026`,
 excerpt:`From content creation to client automation, these tools are transforming how Africa's fastest-growing businesses operate — most under $20/month.`,
 body:`<p>The democratisation of AI tools has created an unprecedented opportunity for entrepreneurs in Nigeria and across Africa.</p>
<h3>The Essential 2026 Stack</h3><ul><li><strong>Claude (Anthropic)</strong> — Best for nuanced business writing, proposals, and strategic thinking.</li><li><strong>Perplexity AI</strong> — Real-time, cited research without hallucination risk.</li><li><strong>Canva AI</strong> — Magic Design and AI image generation for professional visuals.</li><li><strong>ElevenLabs</strong> — Natural-sounding voiceovers in seconds.</li><li><strong>Make.com</strong> — Connect your tools without code. One automation can save 5-10 hours/week.</li><li><strong>Gamma</strong> — AI-generated pitch decks in minutes.</li><li><strong>Julius AI</strong> — Upload a spreadsheet, get insights instantly.</li></ul>
<h3>The Winning Combination</h3><p>Claude drafts the content strategy, Canva produces visuals, Make.com distributes it, ElevenLabs narrates the video version. A 4-person team's output, solo.</p>`},

{id:3,cat:'AI Models',date:'April 2026',rt:'6 min read',featured:false,
 title:`GPT-5 vs Claude 4 vs Gemini 2.5: An Honest Comparison`,
 excerpt:`Three flagship models, three very different strengths. We break down which wins for writing, coding, analysis, and real-world business use.`,
 body:`<p>The AI model wars have reached a point where all three leading models are genuinely capable. The question is no longer which is best but which is best for your use case.</p>
<h3>For Business Writing — Claude 4 Wins</h3><p>Claude's writing is consistently the most natural and contextually aware. For proposals, reports, and marketing copy, Claude 4 requires the least editing.</p>
<h3>For Coding — GPT-5 Edge</h3><p>GPT-5 has a slight edge for complex multi-file code projects. Claude 4 excels at code explanation and debugging.</p>
<h3>For Research — Gemini 2.5 Pro</h3><p>Gemini's deep integration with Google Search gives it a factual advantage for queries requiring current information.</p>
<h3>The Recommendation</h3><p>For writing, automation, and business development: Claude 4. Use Perplexity for research, Claude for creation, Make.com to automate the workflow.</p>`},

{id:5,cat:'Business',date:'March 2026',rt:'7 min read',featured:false,
 title:`How to Build a N1M/Month Business with AI Skills`,
 excerpt:`Five AI-powered income streams that Nigerian entrepreneurs are using to cross the million-naira monthly revenue threshold consistently in 2026.`,
 body:`<p>A N1,000,000 monthly revenue target sounds ambitious until you map the arithmetic. At N200,000 per client, you need 5 clients. At N500,000 per project, you need 2.</p>
<h3>Stream 1: AI Content Retainers (N150k-N350k/month per client)</h3><p>An AI-powered content workflow lets you serve 4-6 clients simultaneously.</p>
<h3>Stream 2: AI Automation Setup (N300k-N800k per project)</h3><p>A single Make.com workflow transforms an SME's operations. Add a monthly maintenance retainer of N50k-N100k.</p>
<h3>Stream 3: Corporate AI Training (N50k per seat)</h3><p>A 3-hour masterclass to a company of 20 staff at N50k/seat = N1,000,000 for a single day's work.</p>

{id:6,cat:'Tutorials',date:'March 2026',rt:'6 min read',featured:false,
 title:`Prompt Engineering in 2026: What Still Works`,
 excerpt:`With longer context windows and smarter models, the rules of effective prompting have evolved. Here's the updated framework that gets consistent results.`,
 body:`<p>Prompt engineering has matured from a niche skill into foundational business literacy. Many 2023 tips are now outdated.</p>
<h3>What Still Works</h3><p><strong>Role + Context + Task + Format (RCTF).</strong> This structure consistently outperforms casual prompts. Negative constraints also work well — telling the model what NOT to do is often more effective than specifying what to do.</p>
<p><strong>Examples (few-shot prompting).</strong> Showing one or two examples of the output format you want dramatically improves consistency.</p>
<h3>What No Longer Works</h3><p>Magic words like "Think step by step" are now unnecessary — modern models reason automatically. Extremely long system prompts also perform worse than concise, precise instructions.</p>
<h3>The 2026 Principle</h3><p>Write prompts the way you would brief a highly intelligent, literal colleague who has no background in your project. Be specific, be concrete, give examples, specify the exact format you need.</p>`},

/* ══ ACCESS HELPERS ══ */
function getAcc(){const s=getSession();return s?.access||{};}

/* hasMC always false — all Masterclass content is locked; visible but purchase-only */

function isUnlocked(lesson){

/* ══ THEME ══ */

  const groups=p==='m2m'?

function renderLessonBody(l){

  <div style="font-size:.78rem;color:var(--text-muted);margin-bottom:.5rem;"><strong style="color:var(--gold);">Business Application:</strong> ${l.inc}</div>
  ${notesHTML}`;
}

function renderNotes(notes){
  const html=notes.map(n=>{
    if(n.s==='step') return `<div class="notes-step"><span class="step-arrow">→</span><div class="step-body">${n.x}</div></div>`;
    if(n.s==='hl') return `<div class="notes-highlight">${n.x}</div>`;
    if(n.s==='warn') return `<div class="notes-warn">⚠️ ${n.x}</div>`;
    if(n.s==='tip') return `<div class="notes-tip">💡 ${n.x}</div>`;
    if(n.s==='check') return `<ul class="notes-checklist">${n.x.map(i=>`<li>${i}</li>`).join('')}</ul>`;
    return '';
  }).join('');
  return `<div class="notes-section"><button class="notes-toggle" onclick="toggleNotes(this)">📖 Participant Notes & Step-by-Step Guide <span class="narrow">▼</span></button><div class="notes-content"><div class="notes-inner">${html}</div></div></div>`;

  const now=new Date();
  const dayNames=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const monthNames=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  // Today widget
  const todayStr=`${dayNames[now.getDay()]} ${now.getDate()} ${monthNames[now.getMonth()]} ${now.getFullYear()}`;
  const timeStr=now.toLocaleTimeString('en-NG',{hour:'2-digit',minute:'2-digit',hour12:true,timeZone:'Africa/Lagos'});
  if(!cls) return `<div class="schedule-card"><div class="schedule-info"><div class="schedule-label">Today</div><div class="schedule-title">${todayStr}</div><div class="schedule-time">🕐 ${timeStr} WAT — No upcoming sessions scheduled</div></div></div>`;
  const clsDate=new Date(cls.date);
  const diffMs=clsDate-now;
  const diffDays=Math.ceil(diffMs/(1000*60*60*24));
  const countdown=diffDays<=0?'Today':diffDays===1?'Tomorrow':`${diffDays} days away`;
  return `<div class="schedule-card">
    <div class="schedule-date-block">
      <div class="schedule-day-num">${clsDate.getDate()}</div>
      <div class="schedule-day-name">${monthNames[clsDate.getMonth()]}</div>
    </div>
    <div class="schedule-divider"></div>
    <div class="schedule-info">
      <div class="schedule-label">Next Live Session</div>
      <div class="schedule-title">${cls.title}</div>
      <div class="schedule-time">🕐 ${cls.time} ${cls.tz} &nbsp;·&nbsp; 📅 ${dayNames[clsDate.getDay()]} ${clsDate.getDate()} ${monthNames[clsDate.getMonth()]}</div>
      <div style="font-size:0.68rem;color:var(--text-muted);margin-top:2px;">ℹ ${cls.notes}</div>
    </div>
    <div class="schedule-countdown">
      <div class="countdown-val">${countdown}</div>
      <div class="countdown-lbl">${diffDays>1?'days remaining':''}</div>
    </div>
  </div>`;
}

/* ══ STATS ══ */
function updateStats(){
  const done=ST.completedDays.length;const pct=Math.round((done/90)*100);
  const s=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=v;};
  s('stDay',ST.currentDay);s('stDone',done);s('stStreak',ST.streak||0);s('stPct',pct+'%');
  s('sBadge',`🔥 ${ST.streak||0}-day streak`);
  const pb=document.getElementById('globalProgressBar');if(pb)pb.style.width=pct+'%';
  const pp=document.getElementById('globalProgressPct');if(pp)pp.textContent=pct+'%';
}

function buildWeekTracker(){
  const c=document.getElementById('wkDays');if(!c) return;
  const days=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const today=new Date().getDay();const todayIdx=today===0?6:today-1;
  c.innerHTML=days.map((d,i)=>{
    const wStart=ST.currentDay-todayIdx+i;
    const done=ST.completedDays.includes(wStart);const isToday=i===todayIdx;
    return `<div class="day-circle ${done?'done':''} ${isToday?'today':''}"><span class="day-name">${d}</span></div>`;
  }).join('');
}

function buildPhaseRings(){
  const c=document.getElementById('phRings');if(!c) return;
  const circ=188.5;
  const groups=ST.currentProg==='m2m'?
    [{lbl:'PHASE 1',nm:'Foundations',s:1,e:30},{lbl:'PHASE 2',nm:'Business',s:31,e:60},{lbl:'PHASE 3',nm:'Mastery',s:61,e:90}]:
    [{lbl:'MONTH 1',nm:'Foundations',s:1,e:30},{lbl:'MONTH 2',nm:'Business',s:31,e:60},{lbl:'MONTH 3',nm:'Mastery',s:61,e:90}];
  c.innerHTML=groups.map(g=>{
    const total=g.e-g.s+1;const done=ST.completedDays.filter(d=>d>=g.s&&d<=g.e).length;const pct=Math.round((done/total)*100);const offset=circ-(pct/100)*circ;
    return `<div class="phase-card"><div class="ring-container"><svg class="ring-svg" viewBox="0 0 70 70" width="60" height="60"><circle class="ring-bg" cx="35" cy="35" r="30"/><circle class="ring-fill" cx="35" cy="35" r="30" stroke-dasharray="${circ}" stroke-dashoffset="${offset}"/></svg><div class="ring-text">${pct}%</div></div><div class="phase-label">${g.lbl}</div><div class="phase-name">${g.nm}</div></div>`;
  }).join('');
}

function buildModCards(){
  const c=document.getElementById('modCards');if(!c) return;
  const p=ST.currentProg;
  const groups=p==='m2m'?
    [{ph:1,nm:'Phase 1 — Foundations',sub:'Text · Image · Productivity · Audio/Video',s:1,e:30},
     {ph:2,nm:'Phase 2 — Business',sub:'Freelancing · Clipping · Automation · Chatbots',s:31,e:60},
     {ph:3,nm:'Phase 3 — Mastery',sub:'Agency · SaaS · Systems · Scale',s:61,e:90}]:
    [{mo:1,nm:'Month 1 — Foundations',sub:'Text AI · Image AI · Productivity · Multimedia',s:1,e:30},
     {mo:2,nm:'Month 2 — Business',sub:'Marketing · Research · Automation · Web Building',s:31,e:60},
     {mo:3,nm:'Month 3 — Mastery',sub:'Advanced Video · Learning AI · Travel · Capstone',s:61,e:90}];
  c.innerHTML=groups.map(g=>{
    const total=g.e-g.s+1;const done=ST.completedDays.filter(d=>d>=g.s&&d<=g.e).length;const pct=Math.round((done/total)*100);
    const unlocked=p==='m2m'?hasM2MPhase(g.ph):hasExpertMonth(g.mo);
    const isActive=ST.currentDay>=g.s&&ST.currentDay<=g.e;const isDone=done===total;const locked=!unlocked;
    return `<div class="module-card ${locked?'locked':''}" onclick="${locked?'':'selectLesson('+g.s+')'}">
      <div class="module-card-hdr"><span class="module-phase-tag">${p==='m2m'?'PHASE':'MONTH'} ${g.ph||g.mo} · DAYS ${g.s}–${g.e}</span><span class="module-status ${locked?'status-locked':isDone?'status-done':isActive?'status-active':'status-locked'}">${locked?'🔒 Locked':isDone?'✓ Done':isActive?'● Active':'◦ Upcoming'}</span></div>
      <div class="module-title">${g.nm}</div><div class="module-sub">${g.sub}</div>
      ${!locked?`<div class="module-bar"><div class="module-bar-fill" style="width:${pct}%"></div></div>`:''}
    </div>`;
  }).join('');
}

/* ══ ACTIONS ══ */
function markDone(){
  if(ST.completedDays.includes(ST.currentDay)) return;
  ST.completedDays.push(ST.currentDay);
  const today=new Date().toDateString();const yesterday=new Date(Date.now()-86400000).toDateString();
  ST.streak=ST.lastEngaged===yesterday?(ST.streak||0)+1:1;ST.lastEngaged=today;
  if(ST.currentDay<90) ST.currentDay++;
  saveSt();if(ST.timerRunning)toggleTimer();
  showToast(`Day ${ST.currentDay-1} complete! 🎉`);renderMain();buildSidebar();
}

function nextL(){if(ST.currentDay<90){ST.currentDay++;saveSt();renderMain();buildSidebar();}}
function prevL(){if(ST.currentDay>1){ST.currentDay--;saveSt();renderMain();buildSidebar();}}

function toggleTimer(){
  const btn=document.getElementById('tBtn');if(!btn) return;
  if(ST.timerRunning){clearInterval(ST.timerInterval);ST.timerRunning=false;btn.textContent='Resume';}
  else{ST.timerRunning=true;btn.textContent='Pause';ST.timerInterval=setInterval(()=>{ST.timerSeconds++;const d=document.getElementById('tmr');if(d){const m=Math.floor(ST.timerSeconds/60).toString().padStart(2,'0');const s=(ST.timerSeconds%60).toString().padStart(2,'0');d.textContent=`${m}:${s}`;}if(ST.timerSeconds>=1800){clearInterval(ST.timerInterval);ST.timerRunning=false;const b=document.getElementById('tBtn');if(b)b.textContent='Done!';showToast('30 minutes done! Mark lesson complete ✓');}},1000);}
}

function setGreeting(){
  const session=getSession();const name=(session?.name||'Student').split(' ')[0];const h=new Date().getHours();
  const g=h<12?'Good morning':h<17?'Good afternoon':'Good evening';const e=h<12?'☀':h<17?'🌤':'🌙';
  const t=document.getElementById('wTitle');if(t)t.textContent=`${g}, ${name}! ${e}`;
  const done=ST.completedDays.length;const sub=document.getElementById('wSub');
  if(sub)sub.textContent=`Day ${ST.currentDay} of 90 · ${done} lessons complete · ${Math.round((done/90)*100)}% progress`;
}

function renderGate(p){
  const labels={expert:'AI Expert User',m2m:'AI Mastery to Money'};
  return `<div class="payment-gate"><div class="gate-icon">🔒</div><div class="gate-title">Unlock ${labels[p]||'Your Programme'}</div><div class="gate-desc">Your account does not yet have access to this programme. Complete payment or contact your admin to unlock your content.</div><div class="gate-actions"><a href="https://paystack.shop/pay/aimadesimple" target="_blank" class="btn-pay">Pay via Paystack ↗</a><button class="btn-outline" onclick="simPay()">Simulate Payment ✓</button></div><p style="font-size:.72rem;color:var(--text-muted);margin-top:1.5rem">Already paid via bank transfer? Send proof on WhatsApp and your admin will grant access.</p></div>`;
}

function simPay(){
  const session=getSession();if(!session) return;const p=ST.currentProg;
  if(!session.access) session.access={};
  if(p==='expert') session.access.expert={months:[1,2,3]};
  if(p==='m2m') session.access.m2m={phases:[1,2,3],tier:'standard'};
  session.paid=true;saveSession(session);
  const users=JSON.parse(localStorage.getItem('ams-users')||'{}');
  if(users[session.email]){users[session.email].access=session.access;users[session.email].paid=true;localStorage.setItem('ams-users',JSON.stringify(users));}
  showToast('✓ Access unlocked for '+p+'!');renderMain();buildSidebar();buildProgTabs();
}

function reqNotif(){if(!('Notification'in window)){showToast('Not supported.');return;}Notification.requestPermission().then(p=>{if(p==='granted'){localStorage.setItem('ams-notifs','1');showToast('Daily reminders enabled! 🔔');}});}
function handleLogout(){if(confirm('Sign out?')){localStorage.removeItem('ams-session');window.location.href='login.html';}}
function showToast(msg){const t=document.createElement('div');t.style.cssText='position:fixed;bottom:4rem;right:1.5rem;background:var(--card-bg);border:1px solid var(--card-border);border-radius:8px;padding:9px 14px;font-size:.78rem;color:var(--text);box-shadow:var(--shadow);z-index:9998;max-width:270px;';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),3200);}

function init(){
  const session=getSession();if(!session){window.location.href='login.html';return;}
  document.getElementById('navUserName').textContent=(session.name||session.email||'').split(' ')[0];
  loadSt();if(!ST.currentDay||ST.currentDay<1)ST.currentDay=1;if(ST.currentDay>90)ST.currentDay=90;
  const acc=session.access||{};
  if(!acc[ST.currentProg]&&!isDemo()){
    if(acc.expert)ST.currentProg='expert';
    else if(acc.m2m)ST.currentProg='m2m';
  }
  buildProgTabs();buildSidebar();renderMain();
}
document.addEventListener('DOMContentLoaded',init);

</script>
</body>
</html>
