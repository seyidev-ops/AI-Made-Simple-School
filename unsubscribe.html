<style>
:root{--gold:#C9A84C;--gold-dim:rgba(201,168,76,.14);--gold-border:rgba(201,168,76,.3);}
[data-theme="dark"]{--bg:#0E0E10;--bg2:#141416;--bg3:#1C1C20;--border:rgba(255,255,255,.08);--text:#F0EDE6;--text-muted:#8A877F;--text-secondary:#B8B5AE;--card-bg:#16161A;--ink:#D9B95C;--p:#E8A87C;--c:#8FC1E3;--t:#A8D5A2;}
[data-theme="light"]{--bg:#F8F6F1;--bg2:#EEEBE4;--bg3:#E4E1DA;--border:rgba(0,0,0,.09);--text:#1A1914;--text-muted:#7A776E;--text-secondary:#4A4740;--card-bg:#FFFFFF;--ink:#8A6A1C;--p:#A4521E;--c:#1F5F8B;--t:#2E6B2A;}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);line-height:1.6;}
a{color:var(--ink);}
.top{position:sticky;top:0;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:0 clamp(1rem,4vw,3rem);height:60px;border-bottom:1px solid var(--border);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text);font-family:'Cormorant Garamond',serif;font-weight:700;font-size:1.12rem;}
.top-r{display:flex;align-items:center;gap:.6rem;}
.login{font-weight:600;font-size:.85rem;text-decoration:none;}
.wrap{max-width:720px;margin:0 auto;padding:0 1rem;}
.hero{padding:clamp(2.5rem,7vw,4.5rem) 0 2rem;text-align:center;}
.eyebrow{display:inline-block;padding:4px 14px;border-radius:100px;background:var(--gold-dim);border:1px solid var(--gold-border);color:var(--ink);font-size:.7rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin-bottom:1rem;}
h1{font-family:'Cormorant Garamond',serif;font-size:clamp(2.3rem,8vw,3.6rem);line-height:1.05;margin-bottom:.9rem;}
h1 em{color:var(--gold);}
.sub{color:var(--text-secondary);max-width:520px;margin:0 auto 1.4rem;}
.chips{display:flex;justify-content:center;gap:.5rem;flex-wrap:wrap;}
.chip{font:700 .74rem 'Space Mono',monospace;padding:.4rem .75rem;border-radius:8px;border:1px solid var(--border);background:var(--card-bg);color:var(--text-secondary);text-decoration:none;}
.chip b{color:var(--ink);}
section.part{background:var(--card-bg);border:1px solid var(--border);border-radius:18px;padding:clamp(1.25rem,4vw,2rem);margin-bottom:1.25rem;}
.part-k{font:700 .7rem 'Space Mono',monospace;letter-spacing:.08em;color:var(--ink);text-transform:uppercase;}
h2{font-family:'Cormorant Garamond',serif;font-size:clamp(1.6rem,5vw,2.1rem);line-height:1.15;margin:.2rem 0 .8rem;}
p{margin-bottom:.8rem;color:var(--text-secondary);}
p strong{color:var(--text);}
.pct{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;margin:1rem 0;}
.pct div{border:1px solid var(--border);border-radius:12px;padding:.85rem;background:var(--bg2);}
.pct b{display:block;font-size:1rem;margin-bottom:.2rem;}
.pct span{font-size:.8rem;color:var(--text-muted);line-height:1.45;display:block;}
.cp{color:var(--p);} .cc{color:var(--c);} .ct{color:var(--t);}
.compare{display:grid;gap:.6rem;margin-top:1rem;}
.ex{border-radius:12px;padding:.9rem 1rem;font-size:.88rem;line-height:1.55;border:1px solid var(--border);background:var(--bg2);}
.ex .lbl{font:700 .66rem 'Space Mono',monospace;letter-spacing:.1em;text-transform:uppercase;display:block;margin-bottom:.35rem;color:var(--text-muted);}
.ex.good{border-color:var(--gold-border);}
.ex.good .lbl{color:var(--ink);}
.form{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;margin:1rem 0;}
.form label{display:flex;flex-direction:column;gap:.3rem;font-size:.78rem;font-weight:600;color:var(--text-secondary);}
.form .full{grid-column:1/-1;}
.form input,.form select{font:500 16px 'DM Sans',sans-serif;padding:.7rem .8rem;border-radius:10px;border:1px solid var(--border);background:var(--bg2);color:var(--text);width:100%;}
.form input:focus,.form select:focus{outline:2px solid var(--gold);outline-offset:1px;}
.prompt{position:relative;border:1px solid var(--gold-border);border-radius:12px;background:var(--bg2);padding:1rem;font-size:.9rem;line-height:1.6;white-space:pre-wrap;color:var(--text);}
.prompt mark{background:none;font-weight:700;}
.prompt .mp{color:var(--p);} .prompt .mc{color:var(--c);} .prompt .mt{color:var(--t);}
.row{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:.8rem;}
.btn{white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:.45rem;padding:.85rem 1.2rem;border-radius:11px;font:700 .92rem 'DM Sans',sans-serif;text-decoration:none;border:1px solid transparent;cursor:pointer;}
.btn-gold{background:linear-gradient(135deg,#D9B95C,#B8933A);color:#141210;box-shadow:0 6px 22px rgba(201,168,76,.25);}
.btn-line{background:transparent;color:var(--ink);border-color:var(--gold-border);}
.btn:active{transform:scale(.98);}
.grow{flex:1 1 180px;}
ol.do{padding-left:1.2rem;margin:.6rem 0 1rem;color:var(--text-secondary);}
ol.do li{margin-bottom:.5rem;}
ol.do b{color:var(--text);}
.next{display:grid;gap:.55rem;margin:1rem 0 1.25rem;}
.next div{display:flex;gap:.8rem;align-items:baseline;font-size:.9rem;color:var(--text-secondary);}
.next b{flex-shrink:0;font:700 .74rem 'Space Mono',monospace;color:var(--ink);width:4.6rem;}
.offer{border:1px solid var(--gold-border);border-radius:14px;padding:1.1rem;background:var(--bg2);}
.price{font-family:'Cormorant Garamond',serif;font-size:2.2rem;font-weight:700;line-height:1;}
.price small{font:500 .85rem 'DM Sans',sans-serif;color:var(--text-muted);}
.fine{font-size:.76rem;color:var(--text-muted);margin-top:.7rem;margin-bottom:0;}
footer{text-align:center;padding:2rem 1rem 2.5rem;font-size:.76rem;color:var(--text-muted);}
@media (max-width:560px){.pct{grid-template-columns:1fr;}.form{grid-template-columns:1fr;}}

.tracks{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin:1rem 0 .4rem;}
.trk{display:flex;flex-direction:column;align-items:flex-start;gap:.15rem;text-align:left;padding:.75rem .8rem;border-radius:12px;border:1px solid var(--border);background:var(--bg2);color:var(--text);font:600 .86rem 'DM Sans',sans-serif;cursor:pointer;min-height:44px;}
.trk small{font-weight:500;font-size:.72rem;color:var(--text-muted);line-height:1.35;}
.trk[aria-pressed="true"]{border-color:var(--gold);background:var(--gold-dim);}
.trk:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
.formula{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;margin:1rem 0;}
.formula div{border:1px solid var(--border);border-radius:12px;padding:.8rem;background:var(--bg2);}
.formula b{display:block;font:700 .95rem 'Cormorant Garamond',serif;font-size:1.25rem;color:var(--ink);}
.formula span{font-size:.78rem;color:var(--text-muted);line-height:1.45;display:block;}
ol.do li span{color:var(--text-secondary);}
.wk{display:grid;gap:.5rem;margin:1rem 0;}
.wk div{border:1px solid var(--border);border-radius:12px;padding:.75rem .9rem;background:var(--bg2);font-size:.86rem;color:var(--text-secondary);}
.wk b{display:block;color:var(--text);font-size:.9rem;margin-bottom:.15rem;}
.wk .hl{border-color:var(--gold-border);}
.warn{border-left:3px solid #e05a5a;background:rgba(224,90,90,.07);border-radius:0 10px 10px 0;padding:.7rem .9rem;font-size:.85rem;color:var(--text);margin:1rem 0 0;}
.srcs{list-style:none;display:grid;gap:.45rem;margin:.6rem 0 0;}
.srcs a{font-weight:600;font-size:.86rem;text-decoration:none;}
.srcs span{display:block;font-size:.72rem;color:var(--text-muted);}
@media (max-width:640px){.tracks{grid-template-columns:1fr 1fr;}.formula{grid-template-columns:1fr;}}
@media (max-width:380px){.tracks{grid-template-columns:1fr;}}

.top-nav{display:flex;gap:1rem;margin-right:.4rem;}
.top-nav a{font-size:.85rem;font-weight:600;text-decoration:none;color:var(--text-secondary);}
.top-nav a[aria-current="page"],.top-nav a:hover{color:var(--ink);}
.parent{display:flex;gap:1rem;align-items:center;border:1px solid var(--gold-border);border-radius:14px;padding:1rem;background:var(--bg2);margin:1rem 0;}
.ona-logo{flex-shrink:0;width:76px;height:76px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 1px var(--border);}
.wordmark{flex-shrink:0;width:76px;height:76px;border-radius:14px;background:var(--card-bg);border:1px solid var(--border);display:grid;place-items:center;text-align:center;font-family:'Cormorant Garamond',serif;font-weight:700;line-height:1;color:var(--ink);}
.wordmark b{display:block;font-size:1.6rem;}
.wordmark small{display:block;font:700 .55rem 'DM Sans',sans-serif;letter-spacing:.12em;color:var(--text-muted);margin-top:.2rem;}
.parent p{margin:0;}
.vals{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;margin:1rem 0;}
.vals div{border:1px solid var(--border);border-radius:12px;padding:.9rem;background:var(--bg2);}
.vals b{display:block;color:var(--text);margin-bottom:.25rem;}
.vals span{font-size:.84rem;color:var(--text-secondary);line-height:1.5;display:block;}
.contact{display:grid;gap:.5rem;margin:1rem 0 0;}
.contact div{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;border-bottom:1px solid var(--border);padding:.55rem 0;font-size:.9rem;}
.contact span{color:var(--text-muted);}
.contact a,.contact b{color:var(--text);font-weight:600;text-decoration:none;word-break:break-word;}
.links{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-top:1rem;}
@media (max-width:640px){.vals{grid-template-columns:1fr;}.links{grid-template-columns:1fr;}.top-nav{display:none;}}

.doc h2{font-size:1.35rem;margin-top:1.6rem}.doc ul{margin:.4rem 0 1rem 1.2rem;color:var(--text-secondary)}.doc li{margin-bottom:.35rem}.doc .fine{margin-top:1.4rem}</style>
