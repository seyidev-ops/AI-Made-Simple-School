name: Daily AI News Posts

# Runs automatically on a schedule, and can also be triggered manually
# from the GitHub "Actions" tab (workflow_dispatch).
on:
  schedule:
    - cron: '0 6 * * *'   # 06:00 UTC every day. Adjust the time if you like.
  workflow_dispatch: {}

permissions:
  contents: write          # needed so the action can commit posts.json back

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate posts
        run: node generate-posts.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit and push if posts.json changed
        run: |
          git config user.name  "AI News Bot"
          git config user.email "bot@users.noreply.github.com"
          git add posts.json
          # Only commit if there is actually a change, otherwise exit cleanly
          git diff --staged --quiet || git commit -m "Add daily AI news posts"
          git push
