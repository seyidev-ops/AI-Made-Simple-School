<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,700&amp;display=swap');
    </style>
  </defs>
  <!-- White background -->
  <rect width="100" height="100" rx="16" fill="#FFFFFF"/>
  <!-- Gold border -->
  <rect x="3" y="3" width="94" height="94" rx="13" fill="none" stroke="#C9A84C" stroke-width="2.5" opacity="0.55"/>
  <!-- Italic AI in Cormorant Garamond — gold, sized to stay within borders -->
  <text
    x="50" y="67"
    font-family="Cormorant Garamond, Georgia, serif"
    font-style="italic"
    font-weight="700"
    font-size="52"
    fill="#C9A84C"
    text-anchor="middle">AI</text>
</svg>
